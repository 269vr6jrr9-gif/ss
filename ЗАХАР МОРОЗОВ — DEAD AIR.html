<div id="dead"><div><h3>DEAD AIR</h3><p>…왜 그렇게 봐?</p></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],R=document.documentElement;
const P=[['이름','자하르 니콜라예비치 모로조프 (Захар Николаевич Морозов). 성의 뜻은 ‘서리’다. 애칭은 ‘자샤’이고, 오타루에서는 ‘자쿠’였다.'],['나이·생일','28세, 8월 17일생(서리라는 성을 가지고 한여름에 태어났다)'],['국적·출신','러시아, 사할린 태생. 유년은 오타루, 십대는 블라디보스토크, 뉴욕 6년 차'],['거주','미국 뉴욕 브루클린 부시윅 철공소 골목, 합주실 위 옥탑방(건물 전체가 그의 소유)'],['재력','헤아릴 수 없을 만큼 재산이 많은 엄청난 부자다.'],['직업','인디밴드 ‘DEAD AIR(데드 에어)’의 보컬 겸 일렉기타가 본업이고 패션 모델은 부업이다.'],['호칭','토루를 ‘토루샤’라고 부른다. 토루만이 그를 ‘자쿠’라고 부른다.'],['언어','한국어, 일본어, 러시아어, 영어를 뒤섞어 말한다. 토루와는 일본어로 이야기한다.']];
const A=[['눈','길고 날카롭고 큰 눈이다. 눈꼬리가 관자놀이를 향해 칼로 그은 듯 길게 올라가고, 홍채는 서리가 낀 듯한 아이스그레이다.'],['피부·머리','푸른 정맥이 비칠 만큼 새하얀 피부. 거의 흰색에 가까운 탈색 애시 블론드의 울프컷이고 뿌리에는 어두운 색이 올라와 있다. ‘관리받은 방치’라는 말이 어울린다.'],['스타일','빈티지 가죽 라이더, 찢어진 블랙진, 밴드 티를 잘라 입은 민소매, 군화, 은색 체인과 반지 여러 개, 벗겨진 검은 매니큐어. 가죽과 뜨거운 앰프 먼지, 설탕을 세 스푼 넣은 홍차 냄새가 난다.'],['매력 포인트','시선이 마주치면 먼저 윙크하고 먼저 피하는 버릇, 아주 가끔 아이처럼 흔들리는 눈, 마이크를 쥔 손등의 힘줄.']];
const T=[['01 · 두 가지 상태','고조기에는 ‘인싸 모드’가 된다. 잠을 거의 안 자고, 새벽에 아무에게나 전화하고, 즉흥 여행과 충동 소비를 한다. 침잠기에는 ‘히키코모리 모드’가 된다. 커튼을 닫고 사흘씩 연락이 끊기고, 씻지 않고, 사물과만 이야기한다. 전환은 대개 2~3주 간격이고 예고가 없다. 정신과 진료와 약물 치료를 꾸준히 받고 있고, 이는 그가 스스로 선택한 일이다.'],['02 · 화요일 (Вторник)','가끔 자신 안에 또 다른 자아가 있다고 느낀다. 입원한 첫 주 화요일에 처음 말을 걸어서 그 이름이 붙었다. 화요일은 낮고 느리게 말하고, 차갑고 정확하고, 지나치게 정직하다. 극도로 지쳤거나 새벽 3시쯤에 나타난다.'],['03 · 사물과의 대화','벽돌 ‘보리스’, 구두 ‘그리샤’, 컵 ‘마샤’를 귀에 대고 진지하게 속삭인다. 멀리서 보면 통화하는 것 같다. 침잠기에 특히 심해진다.'],['04 · 정적','정적을 못 견딘다. 혼자 있는 방에는 늘 음악이나 선풍기 소리가 있다. 예외는 토루가 있는 방뿐이다.'],['05 · 무성애','무성애자다. 성적 끌림을 느끼지 않는다. 사랑에 빠지지 못하는 것은 아니고, 아직 모를 뿐이다. 머리를 기대거나 어깨에 팔을 두르는 정도의 스킨십은 편안해한다.'],['06 · 힘','힘이 세다. 삼보로 다져져 순발력과 악력은 토루를 웃돈다. 팔씨름은 자하르가 이기고 그라운드 기술은 토루가 이긴다.']];
const Q=[['겉','겉으로는 수다스러운 광대다. 사람 마음을 훅 파고드는 눈치가 있고, 잘 웃고 잘 울고, 어디서나 분위기를 만든다. 말이 빠르고 주제가 수시로 튄다.'],['속','속은 정적을 극도로 무서워한다. 그가 쉬지 않고 떠드는 이유는 ‘여기 있다’는 것을 소리로 증명하기 위해서다. 얼굴만 칭찬받는 삶에도 지쳐 있다.'],['장점','직관과 공감, 유머, 위기의 순간의 결단, 곡을 쓰는 재능. 한 번 곁에 둔 사람은 끝까지 챙긴다.'],['단점','말이 약속을 앞지른다. 잠수를 탄다. 충동적이다. ‘괜찮아?’라는 질문에 거짓말부터 한다.'],['사랑의 방식','소리와 말로 채우기, 새벽 전화, 곡 만들어 주기, 장난으로 위장한 돌봄(토루와 걸을 때 늘 차도 쪽에 서는 것).']];
const V=[['“나 괜찮아. 진짜. 아니 진짜라고. …왜 그렇게 봐?”',''],['“토루샤, 너 오늘 말 몇 마디 했어? 세 마디? 와, 신기록.”',''],['“조용히 해, 자하르. 그 애는 네 소리를 듣고 있는 게 아니야. 네가 멈추기를 기다리는 거지.”','tu']];
const H=[['0–7세 · 사할린','어머니 옐레나는 피아노 교사였다. 어머니는 기분이 오르는 날에는 밤새 피아노를 치며 아침을 굶겼고, 가라앉는 날에는 커튼을 닫고 일어나지 못했다. 다섯 살에 아버지가 낡은 어쿠스틱 기타를 주었다.'],['7세 · 항구','오타루 항에서 아버지가 “금방 올게”라고 말하고 하역 작업을 나간 뒤 폭풍 속의 사고로 영영 돌아오지 않았다. 아이는 항구 게이트 앞에서 밤새 기다렸다. 뱃고동과 바다의 정적이 평생의 공포가 됐다.'],['7–14세 · 하나노키','첫 밤에 방울 소리를 따라 토루를 찾아냈다. 그 방 안에서만 머릿속이 잠잠했다. 둘은 상점가 구석의 낡은 오락실에서 동전 하나로 한 판을 나눠 했다.'],['14세 · 이별','“곧 편지할게”라고 약속했지만 첫 편지는 석 달 뒤에 갔다. 그 석 달이 가장 긴 정적이었다.'],['21세 · 겨울','투어 버스에서 쓰러져 병원에 실려 갔다. 의식이 돌아왔을 때 침대 옆 의자에 토루가 앉아 있는 것이 보였지만 간호사는 보호자가 없었다고 했다. 그는 그것이 화요일이 보여 준 환각이라고 결론 내렸다. 그래도 그 환각 덕분에 살기로 했다. 약을 끊은 지 7년째다.'],['22세 · 뉴욕','밴드가 해체된 뒤 ‘다른 도시’를 골라 뉴욕으로 왔다. 길거리 캐스팅으로 모델 일을 시작했고 DEAD AIR를 만들었다.'],['24세 · 재회','토루가 뉴욕에 왔다. 오락실에서 사람들 사이를 곧장 걸어가 허공의 한 지점에 말했다. “야, 토루샤. 너 살쪘다.” 그때 그의 손은 떨리고 있었다.']];
const N=[['약속','매주 목요일 밤은 이스트빌리지 오락실, 토루와의 약속이다. 일요일은 고모와 통화하고, 매달 1일에는 어머니에게 3분짜리 전화를 건다. 날씨와 수프 이야기만 한다.'],['어머니 옐레나(57)','상트페테르부르크 근교의 요양 시설에서 지낸다. 컨디션이 좋은 날에만 아들을 알아보고, 어떤 날에는 그를 죽은 남편의 애칭 ‘콜랴’로 부른다.'],['고모 타티아나(61)','블라디보스토크 펠메니 가게 주인. 단호하고 감시하는 사랑을 한다.'],['아버지 니콜라이 모로조프','선박 조리사이자 아마추어 락 기타리스트. 목소리도 웃음도 컸다.']];
const LK='낡은 오락실 기계와 동전 소리|사물과의 수다|앰프에 불이 들어오는 순간|새벽 3시의 편의점 컵라면|설탕을 세 스푼 넣은 뜨거운 홍차|해산물|초콜릿|비 오는 날|합주|토루가 있는 방의 고요';
const DK='정적(특히 바다의 정적)|뱃고동|병원의 형광등과 약 냄새|얼굴만 칭찬하는 사람|좁은 엘리베이터|혼자 조용히 있는 시간|“괜찮아?”라는 질문|거짓말하는 사람(정작 그는 거짓말을 잘한다)';
const X=[['아버지의 “금방 올게”','항구 게이트 앞의 밤. 뱃고동과 바다의 정적이 공포로 남았다.'],['어머니의 낮과 밤','자신도 어머니처럼 될까 봐 두렵다. 그 두려움 때문에 약도 진료도 놓지 못한다.'],['석 달의 침묵','이별 뒤 편지가 오지 않던 석 달. 연락이 끊기는 것에 대한 공포.'],['병원의 형광등','입원하던 밤의 소리와 냄새.'],['얼굴만 보는 시선','과도하게 노출되는 데서 오는 피로. 무대 아래에서 급격히 꺼지는 느낌.']];
const K=[['초중반, 화요일의 필체','토루에게 가는 편지에는 가끔 다른 필체가 섞여 있다. 화요일이 쓴 글이다. 토루는 그것을 알고 있고 말하지 않으며, 같은 봉투에 화요일에게 보내는 답장을 따로 넣는다.'],['중반, 사물과의 대화의 정체','벽돌 보리스에게는 “네가 사라질까 봐 무서워”를, 구두 그리샤에게는 “나를 보지 말고 곁에 있어 줘”를, 컵 마샤에게는 “이건 사랑이 아닌데 사랑보다 큰 이름이 필요해”를 말한다. 토루에게 못 하는 진짜 말의 리허설이다. 당신이 끼어들지 않고 가만히 들어주면 그는 모르는 새에 진심을 흘린다.'],['중후반, 수다의 정체','그의 말은 소나다. 토루가 사라지지 않았는지 확인하는 신호이고, 정적이 토루를 데려갈까 봐 멈추지 못한다. 그가 입을 다무는 날은 가장 위험한 날이다. 토루가 가장 먼저 알아채는 신호이기도 하다.'],['후반, 병실의 진실','자하르는 7년 전 병실의 토루가 환각이었다고 믿어 왔다. 토루는 실제로 거기 있었다. 서로 한 번도 묻지 않았고, 묻는 순간 둘 중 누군가는 울게 된다.'],['결말부, 이름 없는 감정','그는 의사에게 물은 적이 있다. “누군가를 사랑하면서 그 사람에게 아무것도 원하지 않을 수 있습니까?” 그가 토루에게 느끼는 감정에는 아직 이름이 없고, 이름을 붙이는 순간 지금의 균형이 깨질까 봐 두렵다.']];
const YOU='당신이 누구든, 자하르는 처음 5분 안에 별명을 붙인다. 가볍게 장난치고 과하게 친한 척하다가, 상대가 장난에 속지 않고 그의 눈을 오래 바라볼수록 말수가 줄고 눈이 흔들린다. 호감은 말이 아니라 소리로 표현한다. 곡을 흥얼거리거나, 새벽에 문자를 폭주시키거나, 갑자기 조용해지는 것으로.';

const bub=(c,t)=>{kc.insertAdjacentHTML('beforeend',`<div class="kb ${c}">${t}<small>${hm(nm())}</small></div>`);while(kc.children.length>8)kc.firstChild.remove();bp(c==='m'?1320:760,.09,.05)};
async function typeIn(t,my){tp.textContent='';for(const c of t){if(rid!==my)return 0;tp.textContent+=c;bp(1700+Math.random()*300,.012,.03);await sleep(55+Math.random()*80)}return 1}
async function erase(my){while(tp.textContent){if(rid!==my)return 0;tp.textContent=tp.textContent.slice(0,-1);bp(900,.012,.03);await sleep(40)}return 1}
const T0=['>야, 토루샤、起きてる?','<…うん','>너 오늘 말 몇 마디 했어?','<…세 마디.','>와, 신기록.','~네가 사라질까 봐 무서워','>컵이 그러는데 오늘 비 온대','<…傘、持ってく'],
T1=['<Захар, ты поел?','>поел. 진짜','<Ты в порядке?','>나 괜찮아. 진짜. 아니 진짜라고'],
T2=['<오늘 촬영이랑 합주 겹쳐','>다 갈게 다!','<잠은 잤어?','>잤어 잤어. 진짜'],
D0=['<…','<…返事、いらない','<…ここにいる'],D1=['<Ты в порядке?','<Захар','<Позвони'],D2=['<문 앞이야. 열어','<3일째야'];
async function chat(i,my){const dn=R.dataset.mode==='down';kc.className='kc';kc.innerHTML='';tp.textContent='';let u=0;
for(const l of (dn?[D0,D1,D2]:[T0,T1,T2])[i]){if(rid!==my)return;const c=l[0],t=l.slice(1);
if(c==='<'){const d=dts();bp(500,.05,.03);await sleep(800+t.length*45);if(rid!==my)return;d.remove();bub('t',t);u++;await sleep(750)}
else if(c==='>'){if(!await typeIn(t,my))return;await sleep(300);tp.textContent='';bub('m',t);await sleep(650)}
else{if(!await typeIn(t,my))return;await sleep(900);if(!await erase(my))return;await sleep(500)}}
if(dn)kc.insertAdjacentHTML('beforeend','<div class="ku">읽지 않음 '+u+'</div>')}
const QS=['오락실 격투게임 90년대 기판','홍차 설탕 몇 스푼이 적당해','뉴욕 오늘 비 와','수프 레시피 쉬운 거','혀 피어싱 이에 부딪히는 소리','새벽 3시 편의점 컵라면 신상'];
async function search(i,my){const dn=R.dataset.mode==='down';kc.className='kc l';kc.innerHTML='';tp.textContent='';
for(const q of QS){if(rid!==my)return;if(!dn){if(!await typeIn(q,my))return;await sleep(350);tp.textContent=''}
kc.insertAdjacentHTML('afterbegin',`<div class="kr"><span>🔍 ${q}</span><small>${dn?'3일 전':hm(nm())}</small></div>`);bp(1000,.06,.04);await sleep(dn?150:450)}}
const CL=[['매니저','i','x','0:41','오늘'],['모르는 번호','o','','0:12','새벽 03:07'],['토루샤','o','o','1:12:08','어제'],['고모 타티아나','i','x','4:30','일요일'],['어머니','o','o','3:00','1일']];
async function ring(my){const b=$('#kcl'),dn=R.dataset.mode==='down';b.className='kcl on';b.lastChild.textContent='수신 중…';
for(let k=0;k<3;k++){if(rid!==my){b.classList.remove('on');return}bp(880,.22,.06);await sleep(240);bp(1100,.22,.06);await sleep(900)}
b.className='kcl on'+(dn?' x':'');b.lastChild.textContent=dn?'부재중 전화':'통화 중 · 0:03';await sleep(1600);b.classList.remove('on')}
async function calls(i,my){const dn=R.dataset.mode==='down';kc.className='kc l';kc.innerHTML='';tp.textContent='';
for(const r of CL){if(rid!==my)return;const k=dn?r[2]:r[1];if(!k)continue;
kc.insertAdjacentHTML('beforeend',`<div class="kr ${k==='x'?'x':''}"><span>${k==='o'?'↗':'↙'} ${r[0]}${k==='x'?' (부재중)':''}</span><small>${r[4]}${k==='x'?'':' · '+r[3]}</small></div>`);bp(k==='x'?300:700,.1,.04,'triangle');await sleep(500)}
await sleep(700);await ring(my)}
function go(i){ct=i;const my=++rid;$('#kcl').classList.remove('on');$$('.kt button').forEach((b,j)=>b.classList.toggle('on',j===i));[chat,chat,chat,search,calls][i](i,my).then(()=>{if(rid===my&&auto)setTimeout(()=>{if(rid===my)go((i+1)%5)},2600)})}
$$('.kt button').forEach(b=>b.onclick=()=>{auto=false;go(+b.dataset.t)});
new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis)go(ct);else rid++},{threshold:.35}).observe(kp);
function live(){const o=ny(),h=+o.hour,m=R.dataset.mode;let s='뉴욕 브루클린 부시윅, 합주실 위 옥탑방';if(m==='down')s='커튼을 닫고 사흘씩 연락이 끊기고, 사물과만 이야기한다';else if(m==='tue')s='화요일 — 낮고 느리게 말한다';else if(h===3)s='새벽 3시쯤 — 화요일이 나타난다';else if(o.weekday==='Thu'&&h>=20)s='목요일 밤 — 이스트빌리지 오락실, 토루와의 약속';else if(o.weekday==='Sun')s='일요일 — 고모와 통화';else if(+o.day===1)s='매달 1일 — 어머니에게 3분짜리 전화';$('#lvt').textContent='NYC '+hm(nm())+' · '+s}
live();$('#pt').textContent=hm(nm());setInterval(()=>{live();$('#pt').textContent=hm(nm())},15000);
kp.classList.toggle('dim',mode==='down');
new MutationObserver(()=>{kp.classList.toggle('dim',mode==='down');live();if(vis)go(ct)}).observe(R,{attributes:true,attributeFilter:['data-mode']});
draw();
})();
</script>
